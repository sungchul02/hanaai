<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>키오스크 CMS 콘솔</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --line: #e3e6ea; --ink: #1c2330; --muted: #6b7280;
    --brand: #1d4ed8; --ok: #047857; --warn: #b45309; --bad: #b91c1c;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.55;
    font-family: "Pretendard", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 12px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 700; }
  header .spacer { flex: 1; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .live {
    display: none; background: #ecfdf5; color: var(--ok); border: 1px solid #a7f3d0;
    border-radius: 12px; padding: 2px 10px; font-size: 12px;
  }
  select, button, input, textarea { font-family: inherit; font-size: 13px; }
  select, input, textarea {
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px;
    background: #fff; color: inherit;
  }
  button {
    border: 1px solid var(--line); background: #fff; border-radius: 7px;
    padding: 6px 12px; cursor: pointer; font-weight: 500;
  }
  button:hover { border-color: var(--brand); color: var(--brand); }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.primary:hover { opacity: .9; color: #fff; }
  button.big { padding: 10px 22px; font-size: 14px; }
  button:disabled { opacity: .5; cursor: default; }
  main { padding: 22px 24px 80px; max-width: 980px; margin: 0 auto; }

  nav.top { display: flex; gap: 2px; border-bottom: 1px solid var(--line); background: var(--panel);
            padding: 0 24px; }
  nav.top button { border: 0; border-bottom: 2px solid transparent; border-radius: 0;
                   padding: 10px 14px; color: var(--muted); background: none; }
  nav.top button:hover { color: var(--brand); }
  nav.top button.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 650; }
  nav.top .badge { display: inline-block; margin-left: 5px; background: var(--warn); color: #fff;
                   border-radius: 9px; padding: 0 6px; font-size: 10.5px; font-family: var(--mono); }

  h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 26px 0 10px; font-weight: 700; }
  h2 .sub { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line);
           vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-family: var(--mono); text-align: right; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 12px; font-size: 11px;
         border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .tag.ok { color: var(--ok); border-color: #a7f3d0; background: #ecfdf5; }
  .tag.miss { color: var(--warn); border-color: #fde68a; background: #fffbeb; }
  .tag.ai { color: var(--brand); border-color: #bfdbfe; background: #eff6ff; }
  .tag.weak { color: #3730a3; border-color: #c7d2fe; background: #eef2ff; }

  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .err { margin-bottom: 14px; padding: 10px 14px; background: #fef2f2;
         border: 1px solid #fecaca; color: var(--bad); border-radius: 8px; }

  /* 파이프라인 — 지금 어디까지 왔는지. 이것만 보고 다음 할 일을 알 수 있어야 한다. */
  .pipe { display: flex; gap: 0; margin-bottom: 18px; border: 1px solid var(--line);
          border-radius: 10px; overflow: hidden; background: var(--panel); }
  .pipe .s { flex: 1; padding: 12px 14px; border-right: 1px solid var(--line); position: relative; }
  .pipe .s:last-child { border-right: 0; }
  .pipe .s.now { background: #eff6ff; }
  .pipe .s.done .n { color: var(--ok); }
  .pipe .n { font-size: 11px; color: var(--muted); }
  .pipe .t { font-weight: 600; margin-top: 2px; font-size: 13px; }
  .pipe .v { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 3px; }
  .pipe .s.now .t { color: var(--brand); }
  .pipe .s.open { cursor: pointer; }
  .pipe .s.open:hover { background: #f1f5f9; }
  .pipe .s.now.open:hover { background: #dbeafe; }

  /* 지금 할 차례 — 화면에서 가장 크고 유일한 초점 */
  .now-card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--brand);
              border-radius: 10px; padding: 26px 28px; }
  .now-card .step { color: var(--brand); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  .now-card h3 { margin: 6px 0 0; font-size: 21px; font-weight: 700; }
  .now-card p { margin: 8px 0 0; color: var(--muted); }
  .now-card .cta { margin-top: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .now-card.calm { border-left-color: var(--ok); }
  .now-card.calm .step { color: var(--ok); }

  /* 곁가지 일 — 지금 할 차례가 아니지만 남아 있는 것 */
  .side { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
          margin-top: 16px; }
  .side .c { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
             padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
  .side .n { font-family: var(--mono); font-size: 22px; color: var(--warn); min-width: 34px; }
  .side .l { font-size: 13px; font-weight: 600; }
  .side .d { color: var(--muted); font-size: 11.5px; }
  .side button { margin-left: auto; }

  /* 한 건씩 검토 */
  .one { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
         padding: 22px 24px; }
  .one .count { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .one h3 { margin: 4px 0 0; font-size: 19px; }
  .one .meta { color: var(--muted); margin-top: 6px; }
  .field { margin-top: 14px; }
  .field label { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 4px; }
  .field input, .field textarea { width: 100%; }
  .field textarea { min-height: 92px; resize: vertical; line-height: 1.6; }
  .actions { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .actions .spacer { flex: 1; }
  .samples { margin-top: 12px; font-size: 13px; }
  .samples li { color: #374151; }
  .box { background: #fafbfc; border: 1px solid var(--line); border-radius: 8px;
         padding: 12px 14px; margin-top: 12px; }

  /* 주제 고르기 표 */
  .grouphead td { background: #fafbfc; font-weight: 650; }
  tr.pick td { cursor: pointer; }
  tr.pick:hover td { background: #f8fafc; }
  input[type=checkbox] { width: 15px; height: 15px; vertical-align: -2px; }

  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 12px 14px; }
  .card .l { color: var(--muted); font-size: 11.5px; }
  .card .v { font-family: var(--mono); font-size: 23px; margin-top: 3px; }
  .card .v.warn { color: var(--warn); } .card .v.ok { color: var(--ok); }
</style>
</head>
<body>
<header>
  <h1>키오스크 CMS 콘솔</h1>
  <select id="customer" onchange="loadAll()"></select>
  <span class="spacer"></span>
  <span class="muted" id="ts">—</span>
  <span id="live" class="live"></span>
  <button onclick="loadAll()">새로고침</button>
</header>
<nav class="top" id="nav"></nav>

<main>
  <div id="error"></div>
  <div id="screen"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cid = () => $("customer").value;

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error((await res.text()).slice(0, 300));
  return res.json();
}
function showError(msg) { $("error").innerHTML = msg ? `<div class="err">${esc(msg)}</div>` : ""; }
function when(iso) { return iso ? new Date(iso).toLocaleString("ko-KR") : "—"; }

function flash(message) {
  const el = $("live");
  el.textContent = message;
  el.style.display = "inline";
  setTimeout(() => { el.style.display = "none"; }, 4000);
}

// 검토자 이름을 매번 묻지 않는다. 한 번 물어보고 기억한다.
function reviewerName() {
  let who = null;
  try { who = localStorage.getItem("reviewer"); } catch (e) { /* 사생활 보호 모드 */ }
  if (!who) {
    who = prompt("검토자 이름", "robin");
    if (!who) return null;
    try { localStorage.setItem("reviewer", who); } catch (e) { /* 저장 못해도 진행 */ }
  }
  return who;
}

async function loadCustomers() {
  const rows = await api("/v1/customers");
  $("customer").innerHTML = rows.map(c =>
    `<option value="${c.customer_id}">${esc(c.name)} (${esc(c.code)})</option>`).join("");
}

// ------------------------------------------------------------------ 화면 전환
//
// 한 화면에 한 가지 일만 둔다. 전에는 [할 일] 탭 하나에 중간 보고 · 승인 대기 ·
// 문서 보강 · 중복 메뉴가 세로로 쌓여 있어서, 무엇을 먼저 해야 할지 알 수 없었다.
//
// 홈은 '지금 할 차례' 하나만 크게 보여준다. 작업 화면(주제 고르기 · 초안 검토)은
// 홈에서 들어간다. 나머지는 참고용이라 위쪽 메뉴에 둔다.

const NAV = [
  ["home", "홈"],
  ["menus", "CMS 메뉴"],
  ["questions", "질문"],
  ["docs", "근거 문서"],
  ["runs", "이력"],
];
let view = "home";
let state = {};   // todo · run · report 등 화면이 공유하는 최신 상태

function go(next) {
  view = next;
  showError("");
  render();
  window.scrollTo({ top: 0 });
}

function renderNav() {
  const pending = (state.todo?.pending_review || 0);
  $("nav").innerHTML = NAV.map(([key, label]) => {
    const badge = key === "home" && pending ? `<span class="badge">${pending}</span>` : "";
    const on = (view === key || (key === "home" && !NAV.some(([k]) => k === view))) ? "on" : "";
    return `<button class="${on}" onclick="go('${key}')">${label}${badge}</button>`;
  }).join("");
}

// ------------------------------------------------------------------ 홈

// 파이프라인의 어느 칸에 서 있는가. 이걸 정하는 것이 홈 화면의 전부다.
function currentStep() {
  const t = state.todo || {};
  const r = state.run;
  if (!r) return "triage";                          // 분석한 적 없음
  if (t.pending_review) return "approve";           // 초안이 기다린다
  if (state.waitingTopics) return "pick";           // 고를 주제가 남았다
  if (state.pickedTopics) return "generate";        // 고른 것이 있는데 아직 안 만들었다
  if (t.unanalyzed) return "triage";                // 새 질문이 쌓였다
  return "idle";
}

const STEPS = [
  ["triage",   "① 질문 분류"],
  ["pick",     "② 답할 것 선택"],
  ["generate", "③ 답변 생성"],
  ["approve",  "④ 초안 승인"],
];

function renderPipeline(now) {
  const t = state.todo || {};
  const r = state.run;
  const detail = {
    triage: r ? `${r.questions_seen}건 → ${r.clusters_found}주제` : "아직 안 함",
    pick: r ? `고름 ${state.pickedTopics || 0} · 남음 ${state.waitingTopics || 0}` : "—",
    generate: r ? `초안 ${r.proposals_made || 0}건` : "—",
    approve: `대기 ${t.pending_review || 0}건`,
  };
  // 각 칸을 눌러서 그 단계로 간다. 막대가 상태 표시이자 길잡이다.
  //
  // 처음에는 '지금 할 차례' 만 버튼으로 뒀더니, 초안이 밀려 있으면 ④ 가 먼저 뜨면서
  // ② 로 들어가는 입구가 화면에서 통째로 사라졌다. 고를 주제가 남아 있는데도 갈 수 없었다.
  // 단계가 동시에 열리는 일이 흔하므로 전부 열어둔다.
  const WHERE = { triage: "runTriage()", pick: "go('pick')",
                  generate: "runGeneration()", approve: "go('drafts')" };
  const order = STEPS.map(([k]) => k);
  const nowIndex = order.indexOf(now);
  return `<div class="pipe">` + STEPS.map(([key, label], i) => {
    const cls = key === now ? "now" : (nowIndex > i || nowIndex === -1 ? "done" : "");
    const open = openSteps().has(key);
    return `<div class="s ${cls} ${open ? "open" : ""}"
                 ${open ? `onclick="${WHERE[key]}"` : ""}>
      <div class="n">${cls === "now" ? "지금 여기" : cls === "done" ? "끝남" : "대기"}</div>
      <div class="t">${label}${open && key !== now ? ' <span class="tag miss">할 일</span>' : ""}</div>
      <div class="v">${esc(detail[key])}</div>
    </div>`;
  }).join("") + `</div>`;
}

// 지금 누를 수 있는 단계들. 여러 개가 동시에 열려 있을 수 있다 —
// 주제를 반만 고르고 답변을 만들면 ② 와 ④ 가 같이 열린다.
function openSteps() {
  const t = state.todo || {};
  const open = new Set(["triage"]);            // 분류는 언제든 다시 돌릴 수 있다
  if (state.waitingTopics) open.add("pick");
  if (state.pickedTopics) open.add("generate");
  if (t.pending_review) open.add("approve");
  return open;
}

const NOW_CARD = {
  triage: () => ({
    step: "① 질문 분류",
    title: state.todo.unanalyzed
      ? `새 질문 ${state.todo.unanalyzed}건이 쌓였습니다`
      : "질문을 분류할 차례입니다",
    body: "AI가 비슷한 질문을 묶고, 안내할 가치가 있는지 판단하고, 갈래를 나눕니다.<br>"
        + "답변은 아직 만들지 않습니다. 20초쯤 걸립니다.",
    cta: `<button class="primary big" id="act" onclick="runTriage()">질문 분류 시작</button>`,
  }),
  pick: () => ({
    step: "② 답할 것 선택",
    title: `무엇에 답할지 정할 차례입니다`,
    body: `AI가 주제 ${state.waitingTopics + state.pickedTopics + (state.droppedTopics || 0)}개를 분류했습니다. `
        + `고르지 않은 주제에는 생성 비용이 들지 않습니다.`,
    cta: `<button class="primary big" onclick="go('pick')">중간 보고 보러 가기</button>`
       + `<span class="muted">정할 것 ${state.waitingTopics}개</span>`,
  }),
  generate: () => ({
    step: "③ 답변 생성",
    title: `주제 ${state.pickedTopics}개에 답변을 만들 차례입니다`,
    body: "근거 문서를 찾아 사실만으로 안내문 초안을 씁니다. 근거가 없으면 만들지 않습니다.<br>"
        + "주제 수에 따라 몇 분 걸립니다.",
    cta: `<button class="primary big" id="act" onclick="runGeneration()">답변 생성 시작</button>`
       + `<button onclick="go('pick')">선택 다시 보기</button>`,
  }),
  approve: () => ({
    step: "④ 초안 승인",
    title: `초안 ${state.todo.pending_review}건이 검토를 기다립니다`,
    body: "승인하면 그대로 키오스크에 나갑니다. 근거와 검증 결과를 보고 판단하세요.",
    cta: `<button class="primary big" onclick="go('drafts')">초안 검토하기</button>`,
  }),
  idle: () => ({
    step: "✓ 처리 완료",
    title: "지금 할 일이 없습니다",
    body: "키오스크에 새 질문이 쌓이면 다시 분류할 수 있습니다.",
    cta: `<button onclick="runTriage()">다시 분류하기</button>`,
  }),
};

function renderHome() {
  const now = currentStep();
  const card = NOW_CARD[now]();
  const t = state.todo || {};

  // 곁가지 — 지금 차례는 아니지만 남아 있는 일.
  // 다른 단계도 여기 넣는다. 큰 카드는 하나여야 하지만, 갈 수 있는 곳을 숨기면 안 된다.
  const open = openSteps();
  const side = [
    ["② 답할 주제 고르기", open.has("pick") && now !== "pick" ? state.waitingTopics : 0,
      "아직 정하지 않은 주제입니다", "go('pick')"],
    ["③ 답변 생성", open.has("generate") && now !== "generate" ? state.pickedTopics : 0,
      "고른 주제인데 아직 답을 안 만들었습니다", "runGeneration()"],
    ["④ 초안 승인", open.has("approve") && now !== "approve" ? t.pending_review : 0,
      "승인하면 키오스크에 바로 나갑니다", "go('drafts')"],
    ["문서 보강 필요", t.needs_document, "묻는데 근거 문서가 없어 답을 못 만듭니다", "go('gaps')"],
    ["중복 메뉴", t.duplicate_menus, "제목이 같은 메뉴. 키오스크는 하나만 답합니다", "go('dups')"],
  ].filter(([, n]) => n > 0);

  return renderPipeline(now) + `
    <div class="now-card ${now === "idle" ? "calm" : ""}">
      <div class="step">${esc(card.step)}</div>
      <h3>${esc(card.title)}</h3>
      <p>${card.body}</p>
      <div class="cta">${card.cta}</div>
    </div>` +
    (side.length ? `<div class="side">` + side.map(([label, n, desc, action]) => `
      <div class="c">
        <div class="n">${n}</div>
        <div><div class="l">${label}</div><div class="d">${desc}</div></div>
        <button onclick="${action}">보기</button>
      </div>`).join("") + `</div>` : "");
}

// ------------------------------------------------------------------ ② 주제 고르기

let picks = new Set();

// 분류 결과 요약. alert 는 한 번 뜨고 사라져서 다시 볼 수가 없었다.
// 실제로 "분류를 눌렀는데 기록을 다시 볼 수 없다" 는 말을 들었고,
// 그래서 같은 버튼을 네 번 눌러 분석이 네 개 쌓였다. 기록은 화면에 남아 있어야 한다.
function triageSummary(r) {
  const st = r.stats || {};
  const run = (state.runs || []).find(x => x.analysis_run_id === r.analysis_run_id) || state.run;
  const cost = run?.llm_calls ? ` · LLM ${run.llm_calls}회 $${run.cost_usd?.toFixed(2)}` : "";
  return `<div class="box" style="margin:0 0 14px">
    <b>분석 #${r.analysis_run_id}</b>
    <span class="muted">${run ? when(run.finished_at || run.started_at) : ""}${cost}</span>
    <table style="margin-top:8px"><tbody>
      <tr><td>질문</td><td class="num">${r.questions_seen}건</td>
          <td class="muted">키오스크에 들어온 것 전부</td></tr>
      <tr><td>주제로 묶임</td><td class="num">${r.clusters_found}개</td>
          <td class="muted">비슷한 질문끼리 묶은 결과</td></tr>
      <tr><td>규칙이 제외</td><td class="num">${(st.skipped_small || 0) + (st.skipped_covered || 0)}개</td>
          <td class="muted">질문 ${st.min_cluster_size}건 미만 ${st.skipped_small || 0}개 ·
              기존 메뉴가 답함 ${st.skipped_covered || 0}개</td></tr>
      <tr><td><b>AI가 판단</b></td><td class="num"><b>${st.triage_candidates || 0}개</b></td>
          <td class="muted">통과 ${st.triage_kept || 0}개 · 안내 가치 없어 제외 ${st.triage_dropped || 0}개</td></tr>
    </tbody></table>
  </div>`;
}

function renderPick() {
  const r = state.report;
  if (!r || !r.topics.length) {
    return `<h2>답할 주제 고르기</h2>
      <div class="panel"><div class="empty">아직 분류한 결과가 없습니다.</div></div>
      <div class="actions"><button onclick="go('home')">← 홈으로</button></div>`;
  }
  const groups = {};
  for (const t of r.topics) (groups[t.category] ||= []).push(t);

  const rows = Object.entries(groups).map(([category, list]) => {
    const ids = list.filter(t => t.review_status !== "answered").map(t => t.cluster_id);
    const head = `<tr class="grouphead"><td colspan="4">
        ${esc(category)}
        <span class="muted">주제 ${list.length}개 · 질문 ${list.reduce((a, t) => a + t.size, 0)}건</span>
        ${ids.length ? `<button style="float:right" onclick='pickGroup(${JSON.stringify(ids)})'>모두 선택</button>` : ""}
      </td></tr>`;
    return head + list.map(t => pickRow(t)).join("");
  }).join("");

  return `<h2>② 답할 주제 고르기
      <span class="sub muted">고른 것만 답변을 만듭니다. 고르지 않으면 비용이 들지 않습니다</span></h2>
    ${triageSummary(r)}
    <div class="panel">
      <table>
        <thead><tr>
          <th style="width:34px"><input type="checkbox" onchange="pickAll(this.checked)"></th>
          <th>주제</th><th class="num">질문</th><th>상태</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="actions">
      <button onclick="go('home')">← 홈으로</button>
      <span class="spacer"></span>
      <span class="muted" id="pickcount">${picks.size}개 선택됨</span>
      <button class="primary" onclick="savePicks()">선택 저장</button>
    </div>`;
}

const PICK_LABEL = {
  pending_review: ["정할 차례", "miss"],
  approved:       ["답변 만들기로 함", "ok"],
  rejected:       ["제외", ""],
  answered:       ["답변 생성됨", "ai"],
};

function pickRow(t) {
  const [label, cls] = PICK_LABEL[t.review_status] || [t.review_status, ""];
  const locked = t.review_status === "answered";
  const gap = t.evidence_found === false
    ? `<div class="muted" style="margin-top:3px">근거 문서 없음: ${
        (t.evidence_missing || []).map(esc).join(" / ")}</div>` : "";
  const box = locked ? ""
    : `<input type="checkbox" ${picks.has(t.cluster_id) ? "checked" : ""}
         onchange="togglePick(${t.cluster_id}, this.checked)">`;
  return `<tr class="${locked ? "" : "pick"}">
    <td>${box}</td>
    <td>${esc(t.label)}
      <div class="muted" style="margin-top:3px">${esc(t.triage_reason)}</div>${gap}</td>
    <td class="num">${t.size}</td>
    <td><span class="tag ${cls}">${esc(label)}</span></td>
  </tr>`;
}

// 지난 분석의 중간 보고를 다시 연다. 분류를 여러 번 돌리면 이전 기록이
// 홈에서 밀리는데, 그렇다고 사라져서는 안 된다.
async function openReport(runId) {
  try {
    state.report = await api(`/v1/analysis/${runId}/report`);
    const open = state.report.topics.filter(t => t.review_status !== "answered");
    picks = new Set(open.filter(t => t.review_status === "approved").map(t => t.cluster_id));
    state.pickRun = runId;
    go("pick");
  } catch (e) { showError(e.message); }
}

function togglePick(id, on) {
  if (on) picks.add(id); else picks.delete(id);
  const el = $("pickcount");
  if (el) el.textContent = `${picks.size}개 선택됨`;
}
function pickGroup(ids) { ids.forEach(id => picks.add(id)); render(); }
function pickAll(on) {
  const r = state.report;
  if (!r) return;
  picks = new Set(on ? r.topics.filter(t => t.review_status !== "answered").map(t => t.cluster_id) : []);
  render();
}

async function savePicks() {
  const who = reviewerName();
  if (!who || !state.report) return;
  const all = state.report.topics.filter(t => t.review_status !== "answered").map(t => t.cluster_id);
  const chosen = all.filter(id => picks.has(id));
  const dropped = all.filter(id => !picks.has(id));
  try {
    const run = state.report.analysis_run_id;
    if (chosen.length) {
      await api(`/v1/analysis/${run}/review`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ reviewer: who, cluster_ids: chosen, action: "approved" })
      });
    }
    if (dropped.length) {
      await api(`/v1/analysis/${run}/review`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ reviewer: who, cluster_ids: dropped, action: "rejected" })
      });
    }
    await loadAll();
    go("home");
    flash(`${chosen.length}개 주제를 골랐습니다. [답변 생성]을 누르세요`);
  } catch (e) { showError(e.message); }
}

// ------------------------------------------------------------------ ④ 초안 검토 (한 건씩)
//
// 수십 건을 세로로 펼치면 스크롤만 하다 끝난다. 승인은 그대로 시민에게 나가는 문장이라
// 한 건씩 제대로 보는 편이 맞다.

let drafts = [];
let draftAt = 0;
let deferred = new Set();   // '나중에' 는 서버 상태가 아니라 이번 세션의 순서 조정일 뿐이다

function visibleDrafts() {
  const fresh = drafts.filter(p => !deferred.has(p.proposal_id));
  return fresh.length ? fresh : drafts;
}

function renderDrafts() {
  const list = visibleDrafts();
  if (!list.length) {
    return `<h2>초안 검토</h2>
      <div class="panel"><div class="empty">검토할 초안이 없습니다.</div></div>
      <div class="actions"><button onclick="go('home')">← 홈으로</button></div>`;
  }
  if (draftAt >= list.length) draftAt = 0;
  const p = list[draftAt];

  return `<h2>④ 초안 검토 <span class="sub muted">승인하면 그대로 키오스크에 나갑니다</span></h2>
    <div class="one">
      <div class="count">${draftAt + 1} / ${list.length}</div>
      <h3>${esc(p.title)}</h3>
      <div class="meta">추천 이유: ${esc(p.reason)}</div>
      <div class="muted" style="margin-top:4px">
        질문 ${p.question_count}건 · 우선순위 ${p.impact_score} · 확신도 ${p.confidence}
      </div>
      ${verifyLine(p)}
      <div id="ev${p.proposal_id}" class="muted" style="margin-top:8px">근거 확인 중…</div>

      <div class="samples">대표 질문:
        <ul>${p.sample_questions.map(q => `<li>${esc(q)}</li>`).join("")}</ul>
      </div>

      <div class="box">
        <div class="field"><label>메뉴명</label>
          <input id="t${p.proposal_id}" value="${esc(p.title)}"></div>
        <div class="field"><label>안내 문구</label>
          <textarea id="b${p.proposal_id}">${esc(p.body)}</textarea></div>
        <div class="field"><label>검색 키워드 (쉼표로 구분)</label>
          <input id="k${p.proposal_id}" value="${esc(p.keywords.join(', '))}"></div>
      </div>

      <div class="actions">
        <button class="primary" onclick="approve(${p.proposal_id})">추가하기</button>
        <button onclick="ignoreIt(${p.proposal_id})">무시</button>
        <button onclick="deferDraft(${p.proposal_id})">나중에</button>
        <span class="spacer"></span>
        <button onclick="moveDraft(-1)" ${draftAt === 0 ? "disabled" : ""}>‹ 이전</button>
        <button onclick="moveDraft(1)" ${draftAt >= list.length - 1 ? "disabled" : ""}>다음 ›</button>
      </div>
    </div>
    <div class="actions"><button onclick="go('home')">← 홈으로</button></div>`;
}

function moveDraft(step) { draftAt += step; render(); loadEvidenceForCurrent(); }
function deferDraft(id) { deferred.add(id); render(); loadEvidenceForCurrent(); }

function loadEvidenceForCurrent() {
  const list = visibleDrafts();
  if (list[draftAt]) loadEvidence(list[draftAt].proposal_id);
}

// Agent 가 초안을 실제 매처에 넣어본 결과. 승인 여부를 감이 아니라 숫자로 판단하게 한다.
function verifyLine(p) {
  if (p.verified_total == null) return "";
  const pct = (p.verified_coverage * 100).toFixed(0);
  const good = p.verified_coverage >= 0.8;
  const fixed = p.revisions > 0 ? ` · AI가 ${p.revisions}회 보완` : "";
  const misses = p.remaining_misses.length
    ? `<div class="muted" style="margin-top:4px">아직 못 잡는 질문: ${
        p.remaining_misses.slice(0, 3).map(esc).join(" / ")}</div>` : "";
  return `<div style="margin-top:10px">
      <span class="tag ${good ? 'ok' : 'miss'}">검증 ${pct}%</span>
      <span class="muted">이 메뉴를 넣으면 대상 질문 ${p.verified_total}건 중
        ${p.verified_matched}건이 답이 됩니다${fixed}</span>
      ${misses}
    </div>`;
}

// AI 가 무엇을 보고 이 문장을 썼는지. 출처를 확인하지 않고 승인하면
// 그 안내가 맞는지 아무도 모르는 채로 키오스크에 나간다.
async function loadEvidence(id) {
  const el = $("ev" + id);
  if (!el) return;
  try {
    const rows = await api(`/v1/proposals/${id}/evidence`);
    if (!rows.length) {
      el.innerHTML = '<span class="tag miss">근거 문서 없음</span> 내용을 직접 확인한 뒤 승인하세요';
      return;
    }
    el.innerHTML = '<b>근거:</b> ' + rows.map(e => {
      const label = esc(e.document_title) + (e.heading ? " / " + esc(e.heading) : "");
      return e.document_url
        ? `<a href="${esc(e.document_url)}" target="_blank" rel="noopener">${label}</a>`
        : label;
    }).join(" · ");
  } catch (e) { el.textContent = ""; }
}

async function approve(id) {
  const reviewer = reviewerName();
  if (!reviewer) return;

  // 같은 제목의 메뉴가 이미 있으면 먼저 물어본다. 묻지 않았더니
  // '증명서 발급 수수료' 메뉴가 네 개까지 늘었고, 키오스크는 그중 하나만 답했다.
  let on_duplicate = "new";
  let duplicate_of = null;
  try {
    const dup = await api(`/v1/proposals/${id}/duplicate`);
    if (dup) {
      const pick = prompt(
        `'${dup.title}' 메뉴가 이미 있습니다 (#${dup.menu_id}).\n\n` +
        `기존 내용: ${dup.body.slice(0, 120)}\n\n` +
        `1 = 기존 메뉴를 이 내용으로 교체 (권장)\n` +
        `2 = 기존 메뉴에 내용 합치기\n` +
        `3 = 별도 메뉴로 추가`, "1");
      if (pick === null) return;
      on_duplicate = { "1": "replace", "2": "merge", "3": "new" }[pick.trim()] || "replace";
      duplicate_of = on_duplicate === "new" ? null : dup.menu_id;
    }
  } catch (e) { /* 중복 확인 실패가 승인을 막을 이유는 없다 */ }

  const body = {
    reviewer,
    title: $("t" + id).value.trim(),
    body: $("b" + id).value.trim(),
    keywords: $("k" + id).value.split(",").map(s => s.trim()).filter(Boolean),
    on_duplicate, duplicate_of,
  };
  try {
    await api(`/v1/proposals/${id}/approve`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    });
    await loadAll();
    flash("메뉴가 반영되었습니다. 키오스크가 바로 답합니다");
  } catch (e) { showError(e.message); }
}

async function ignoreIt(id) {
  const reviewer = reviewerName();
  if (!reviewer) return;
  const note = prompt("무시하는 이유 (프롬프트 개선에 씁니다)", "") || null;
  try {
    await api(`/v1/proposals/${id}/ignore`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ reviewer, note })
    });
    await loadAll();
  } catch (e) { showError(e.message); }
}

// ------------------------------------------------------------------ 곁가지 화면

function renderGaps() {
  const rows = (state.topics || []).filter(t => t.evidence_found === false);
  const body = rows.length ? `<table><thead><tr>
      <th>대표 질문</th><th class="num">질문</th><th>AI가 확인한 것</th>
    </tr></thead><tbody>` + rows.map(t => `<tr>
      <td>${esc(t.label)}<div class="muted" style="margin-top:3px">${esc(t.triage_reason)}</div></td>
      <td class="num">${t.size}</td>
      <td class="muted">${(t.evidence_missing || []).map(esc).join("<br>")}</td>
    </tr>`).join("") + `</tbody></table>`
    : '<div class="empty">근거 문서가 없어 막힌 주제가 없습니다.</div>';
  return `<h2>문서 보강 필요
      <span class="sub muted">근거 문서에 이 내용을 넣으면 다음 분석에서 답이 만들어집니다</span></h2>
    <div class="panel">${body}</div>
    <div class="actions"><button onclick="go('home')">← 홈으로</button>
      <span class="muted">문서는 db/seeds/cheonan_documents.py 에 넣고 seed.py 를 다시 실행합니다</span>
    </div>`;
}

function renderDups() {
  const rows = state.dups || [];
  const body = rows.length ? `<table><thead><tr>
      <th>메뉴명</th><th>안내 문구</th><th>수정 시각</th><th></th>
    </tr></thead><tbody>` + rows.map(m => `<tr>
      <td><b>${esc(m.title)}</b> <span class="muted">#${m.menu_id}</span></td>
      <td style="max-width:400px">${esc(m.body)}</td>
      <td class="muted">${when(m.updated_at)}</td>
      <td><button onclick="archiveMenu(${m.menu_id}, '${esc(m.title)}')">이것 삭제</button></td>
    </tr>`).join("") + `</tbody></table>`
    : '<div class="empty">중복된 메뉴가 없습니다.</div>';
  return `<h2>중복 메뉴 <span class="sub muted">키오스크는 하나만 답합니다</span></h2>
    <div class="panel">${body}</div>
    <div class="actions"><button onclick="go('home')">← 홈으로</button></div>`;
}

async function archiveMenu(menuId, title) {
  if (!confirm(`'${title}' (#${menuId}) 를 보관 처리합니다.\n키오스크가 이 메뉴로 답하지 않게 됩니다.`)) return;
  try {
    await api(`/v1/menus/${menuId}`, {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: "archived" })
    });
    await loadAll();
    flash("메뉴를 보관했습니다");
  } catch (e) { showError(e.message); }
}

// ------------------------------------------------------------------ CMS 메뉴

let editing = null;

function renderMenus() {
  const rows = state.menus || [];
  const table = rows.length ? `<table><thead><tr>
      <th>메뉴명</th><th>안내 문구</th><th>키워드</th><th>출처</th><th></th>
    </tr></thead><tbody>` + rows.map(m => `<tr>
      <td><b>${esc(m.title)}</b></td>
      <td style="max-width:360px">${esc(m.body)}</td>
      <td class="muted">${m.keywords.map(esc).join(", ")}</td>
      <td>${m.origin === "ai_proposal" ? '<span class="tag ai">AI 추천</span>' : '<span class="tag">직접 작성</span>'}</td>
      <td><button onclick='openEditor(${JSON.stringify(m).replace(/'/g, "&#39;")})'>수정</button></td>
    </tr>`).join("") + `</tbody></table>`
    : '<div class="empty">메뉴가 없습니다. 질문이 쌓이면 AI가 제안합니다.</div>';
  return `<h2>CMS 메뉴 <span class="sub muted">키오스크가 지금 답할 수 있는 내용 ${rows.length}개</span>
      <button style="float:right;text-transform:none;letter-spacing:0"
              onclick="openEditor()">+ 메뉴 직접 추가</button></h2>
    <div id="editor"></div>
    <div class="panel">${table}</div>`;
}

function openEditor(menu) {
  editing = menu || null;
  const m = menu || { title: "", body: "", keywords: [] };
  $("editor").innerHTML = `
    <div class="one" style="margin-bottom:14px">
      <h3>${menu ? "메뉴 수정 — " + esc(menu.title) : "새 메뉴"}</h3>
      <div class="box">
        <div class="field"><label>메뉴명</label><input id="m_title" value="${esc(m.title)}"></div>
        <div class="field"><label>안내 문구</label><textarea id="m_body">${esc(m.body)}</textarea></div>
        <div class="field"><label>검색 키워드 (쉼표로 구분 · 두 글자 이상)</label>
          <input id="m_keywords" value="${esc(m.keywords.join(', '))}"></div>
      </div>
      <div class="actions">
        <button onclick="previewMenu()">미리보기</button>
        <button class="primary" onclick="saveMenu()">${menu ? "저장" : "추가"}</button>
        <button onclick="closeEditor()">취소</button>
        <span class="muted">미리보기를 누르면 이 메뉴가 어떤 질문을 잡는지 실제로 돌려봅니다</span>
      </div>
      <div id="m_preview"></div>
    </div>`;
  $("editor").scrollIntoView({ behavior: "smooth", block: "start" });
}

function closeEditor() { editing = null; $("editor").innerHTML = ""; }

function editorPayload() {
  return {
    title: $("m_title").value.trim(),
    body: $("m_body").value.trim(),
    keywords: $("m_keywords").value.split(",").map(s => s.trim()).filter(Boolean),
  };
}

async function previewMenu() {
  const p = editorPayload();
  try {
    const out = await api("/v1/menus/preview", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...p, customer_id: Number(cid()),
                             menu_id: editing ? editing.menu_id : null })
    });
    const list = out.samples.length
      ? `<ul>${out.samples.map(q => `<li>${esc(q)}</li>`).join("")}</ul>`
      : '<div class="muted">새로 잡는 질문이 없습니다. 키워드를 늘려보세요.</div>';
    $("m_preview").innerHTML = `
      <div class="box">
        <b>이 메뉴가 새로 답하게 되는 질문 ${out.by_draft}건</b>
        <span class="muted">(아직 답하지 못한 질문 ${out.total}건 기준)</span>
        ${list}
      </div>`;
  } catch (e) { showError(e.message); }
}

async function saveMenu() {
  const p = editorPayload();
  if (!p.title || p.body.length < 10 || !p.keywords.length) {
    showError("메뉴명, 안내 문구(10자 이상), 키워드 1개 이상이 필요합니다.");
    return;
  }
  try {
    if (editing) {
      await api(`/v1/menus/${editing.menu_id}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(p)
      });
    } else {
      await api("/v1/menus", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...p, customer_id: Number(cid()) })
      });
    }
    editing = null;
    await loadAll();
    flash("메뉴가 반영되었습니다. 키오스크가 바로 답합니다");
  } catch (e) { showError(e.message); }
}

// ------------------------------------------------------------------ 질문

// 판정은 두 곳에서 나온다. 규칙(욕설·너무 짧음)과 LLM(안내 가치 없음).
const VERDICTS = {
  pending:    ["분석 전", ""],
  useful:     ["유효", "ok"],
  irrelevant: ["AI가 제외", "miss"],
  abusive:    ["욕설", "miss"],
  too_short:  ["너무 짧음", ""],
};

function verdictCell(q) {
  let [label, cls] = VERDICTS[q.verdict] || [q.verdict, ""];
  // 이유가 없는 'useful' 은 LLM 이 유효하다고 판단한 게 아니라,
  // 규칙이 거를 거리를 못 찾았을 뿐이다. 둘을 같은 말로 쓰면 화면이 거짓말을 한다.
  if (q.verdict === "useful" && !q.verdict_reason) { label = "유효 (규칙)"; cls = ""; }
  const why = q.verdict_reason
    ? `<div class="muted" style="margin-top:3px">${esc(q.verdict_reason)}</div>` : "";
  return `<span class="tag ${cls}">${esc(label)}</span>${why}`;
}

function renderQuestions() {
  const rows = state.questions || [];
  const table = rows.length ? `<table><thead><tr>
      <th>시각</th><th>질문</th><th>응답</th><th>판정</th>
    </tr></thead><tbody>` + rows.map(q => `<tr>
      <td class="muted" style="white-space:nowrap">${when(q.asked_at)}</td>
      <td>${esc(q.question_text)}</td>
      <td>${q.answer_source === "cms_menu"
            ? `<span class="tag ok">응답</span> ${esc(q.matched_menu_title)}`
            : q.answer_source === "low_confidence"
              ? `<span class="tag weak">약한 매칭</span> ${esc(q.matched_menu_title)} (${q.match_score})`
              : '<span class="tag miss">답변 불가</span>'}</td>
      <td>${verdictCell(q)}</td>
    </tr>`).join("") + `</tbody></table>`
    : '<div class="empty">질문이 없습니다.</div>';
  return `<h2>최근 질문 <span class="sub muted">10초마다 자동 갱신</span>
      <label class="sub muted" style="float:right">
        <input type="checkbox" id="onlyMiss" ${state.onlyMiss ? "checked" : ""}
               onchange="state.onlyMiss=this.checked; loadAll()"> 답하지 못한 것만</label></h2>
    <div class="panel">${table}</div>`;
}

// ------------------------------------------------------------------ 근거 문서

function renderDocs() {
  const rows = state.documents || [];
  const table = rows.length ? `<table><thead><tr>
      <th>문서</th><th class="num">조각</th><th>수집 시점</th><th>메모</th>
    </tr></thead><tbody>` + rows.map(d => `<tr>
      <td>${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a>` : esc(d.title)}</td>
      <td class="num">${d.chunk_count}</td>
      <td class="muted">${when(d.fetched_at)}</td>
      <td class="muted">${esc(d.note)}</td>
    </tr>`).join("") + `</tbody></table>`
    : '<div class="empty">근거 문서가 없습니다. python scripts/seed.py 를 실행하세요.</div>';
  return `<h2>근거 문서 <span class="sub muted">AI는 여기 적힌 것만 사실로 씁니다</span></h2>
    <div class="panel">${table}</div>`;
}

// ------------------------------------------------------------------ 이력

function renderRuns() {
  const s = state.summary || {};
  const rows = state.runs || [];
  const t = state.todo || {};
  const total = (t.approved_as_is || 0) + (t.approved_edited || 0);
  const pct = total ? Math.round(t.approved_as_is / total * 100) : null;

  const cards = [
    ["질문 7일", (s.questions_7d || 0).toLocaleString(), ""],
    ["답변률", s.answer_rate_7d == null ? "—" : (s.answer_rate_7d * 100).toFixed(1) + "%",
      s.answer_rate_7d != null && s.answer_rate_7d < 0.7 ? "warn" : "ok"],
    ["답하지 못함", (s.unanswered_7d || 0).toLocaleString(), s.unanswered_7d ? "warn" : "ok"],
    ["약한 매칭", (s.weak_7d || 0).toLocaleString(), s.weak_7d ? "warn" : ""],
    ["불필요 질문", (s.junk_7d || 0).toLocaleString(), ""],
    ["CMS 메뉴", s.menus_published || 0, ""],
  ];

  const table = rows.length ? `<table><thead><tr>
      <th>시각</th><th>상태</th><th class="num">질문</th><th class="num">주제</th>
      <th class="num">초안</th><th>LLM</th><th></th>
    </tr></thead><tbody>` + rows.map(r => `<tr>
      <td class="muted" style="white-space:nowrap">${when(r.finished_at || r.started_at)}</td>
      <td>${r.status === "succeeded" ? '<span class="tag ok">완료</span>'
            : r.status === "awaiting_review" ? '<span class="tag miss">선택 대기</span>'
            : `<span class="tag miss">${esc(r.status)}</span>`}
          ${r.error ? `<div class="muted">${esc(r.error.slice(0, 70))}</div>` : ""}</td>
      <td class="num">${r.questions_seen}</td>
      <td class="num">${r.clusters_found}</td>
      <td class="num">${r.proposals_made}</td>
      <td class="muted">${r.llm_calls ? `${r.llm_calls}회 · $${r.cost_usd?.toFixed(2)}` : "—"}</td>
      <td><button onclick="openReport(${r.analysis_run_id})">중간 보고</button></td>
    </tr>`).join("") + `</tbody></table>`
    : '<div class="empty">분석 이력이 없습니다.</div>';

  return `<h2>초안 품질 <span class="sub muted">승인할 때 손봐야 했던 비율</span></h2>
    <div class="panel">${pct === null
      ? '<div class="empty">아직 승인한 추천이 없습니다.</div>'
      : `<table><tbody>
          <tr><td>AI 초안을 그대로 씀</td><td class="num">${t.approved_as_is}</td>
              <td><span class="tag ${pct >= 50 ? "ok" : ""}">${pct}%</span></td></tr>
          <tr><td>관리자가 손봄</td><td class="num">${t.approved_edited}</td>
              <td class="muted">손보는 비율이 높으면 프롬프트를 고칠 때입니다</td></tr>
        </tbody></table>`}</div>
    <h2>분석 이력</h2>
    <div class="panel">${table}</div>
    <h2>질문 통계 <span class="sub muted">최근 7일</span></h2>
    <div class="cards">${cards.map(([l, v, c]) =>
      `<div class="card"><div class="l">${l}</div><div class="v ${c}">${v}</div></div>`).join("")}</div>`;
}

// ------------------------------------------------------------------ 실행

// 실행 중에는 다시 못 누르게 막는다.
// 버튼 하나만 잠갔더니 파이프라인 막대로 또 눌려서 분석이 네 개 쌓였다.
// 화면 어디서 부르든 막아야 한다.
let busy = null;

function setBusy(label) {
  busy = label;
  render();
}

function busyBanner() {
  return busy ? `<div class="now-card" style="margin-bottom:16px">
      <div class="step">진행 중</div>
      <h3>${esc(busy)}</h3>
      <p>끝나면 화면이 저절로 바뀝니다. 창을 닫지 마세요.</p>
    </div>` : "";
}

// 1단계 — 싸다. 묶고 판단하고 갈래를 나눌 뿐 답변은 안 만든다.
async function runTriage() {
  if (busy) return;
  // 아직 고르지 않은 분석이 남아 있으면 먼저 알린다. 새로 돌리면 그 기록이 화면에서 밀린다.
  if (state.waitingTopics) {
    if (!confirm(
      `아직 정하지 않은 주제가 ${state.waitingTopics}개 남아 있습니다 (분석 #${state.run.analysis_run_id}).\n\n` +
      `새로 분류하면 이 기록은 [이력]에서만 볼 수 있게 됩니다.\n` +
      `그래도 새로 분류할까요?`)) { go("pick"); return; }
  }
  setBusy("질문을 분류하고 있습니다");
  try {
    const out = await api("/v1/analysis/triage", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ customer_id: Number(cid()), days: 7 })
    });
    showError(out.error || "");
    picks = new Set();
    await loadAll();
    alert(
      `질문 분류 완료\n\n` +
      `질문 ${out.questions_seen}건 → 주제 ${out.clusters_found}개\n` +
      `  · ${out.stats.skipped_covered || 0}개는 기존 메뉴가 이미 답하고 있어 제외\n` +
      `  · ${out.stats.skipped_small || 0}개는 질문이 ${out.stats.min_cluster_size}건 미만이라 제외\n\n` +
      `AI가 판단한 주제 ${out.stats.triage_candidates || 0}개\n` +
      `  · ${out.kept}개 통과 · ${out.dropped}개 제외 (안내 가치 없음)`
    );
    if (out.kept) { view = "pick"; }
  } catch (e) { showError(e.message); }
  finally { busy = null; render(); }
}

// 2단계 — 비싸다. 고른 주제만 근거를 찾고 답변을 만든다.
async function runGeneration() {
  if (busy) return;
  if (!state.run) { showError("먼저 질문 분류를 실행하세요."); return; }
  setBusy("답변을 만들고 있습니다 (몇 분 걸립니다)");
  try {
    const out = await api(`/v1/analysis/${state.run.analysis_run_id}/generate`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: "{}"
    });
    showError(out.error ? "일부 응답이 검증을 통과하지 못했습니다: " + out.error : "");
    await loadAll();
    const lines = [
      `답변 생성 완료`, ``,
      `고른 주제 ${out.approved_topics}개`,
      `  · 근거 확보 ${out.evidence_found}개`,
    ];
    if (out.evidence_missing) {
      lines.push(`  · 근거 문서가 없어 만들지 않음 ${out.evidence_missing}개`,
                 `    (지어내지 않습니다. 홈의 '문서 보강 필요'를 확인하세요)`);
    }
    lines.push(``, `초안 ${out.proposals_made}건 생성`);
    if (out.stats.blocked_duplicate) {
      lines.push(`  · ${out.stats.blocked_duplicate}건은 이미 검토했거나 반영한 주제라 제외`);
    }
    alert(lines.join("\n"));
    if (out.proposals_made) { view = "drafts"; }
  } catch (e) { showError(e.message); }
  finally { busy = null; render(); }
}

// ------------------------------------------------------------------ 데이터 적재

const SCREENS = {
  home: renderHome, pick: renderPick, drafts: renderDrafts,
  gaps: renderGaps, dups: renderDups,
  menus: renderMenus, questions: renderQuestions, docs: renderDocs, runs: renderRuns,
};

function render() {
  renderNav();
  $("screen").innerHTML = busyBanner() + (SCREENS[view] || renderHome)();
  if (view === "drafts") loadEvidenceForCurrent();
}

// 홈에 필요한 것은 항상 부른다. 나머지는 지금 보고 있는 화면에 필요한 것만 부른다.
// 안 보는 표를 10초마다 새로 그릴 이유가 없고, 그만큼 DB 도 덜 때린다.
async function loadAll() {
  if (!cid()) return;
  try {
    const [todo, runs, proposals] = await Promise.all([
      api(`/v1/todo?customer_id=${cid()}`),
      api(`/v1/analysis/runs?customer_id=${cid()}&limit=1`),
      api(`/v1/proposals?customer_id=${cid()}&status=pending_review`),
    ]);
    state.todo = todo;
    state.run = runs[0] || null;
    drafts = proposals;

    if (state.run) {
      // 지난 분석 보고를 열어둔 상태면 그것을 유지한다. 자동 갱신이 덮어쓰면
      // 보던 기록이 눈앞에서 최신 것으로 바뀐다.
      const showing = (view === "pick" && state.pickRun) || state.run.analysis_run_id;
      state.report = await api(`/v1/analysis/${showing}/report`);
      const open = state.report.topics.filter(t => t.review_status !== "answered");
      state.waitingTopics = open.filter(t => t.review_status === "pending_review").length;
      state.pickedTopics = open.filter(t => t.review_status === "approved").length;
      state.droppedTopics = open.filter(t => t.review_status === "rejected").length;
      // 화면을 처음 열었을 때 이미 고른 것이 체크되어 있어야 한다
      if (!picks.size) {
        picks = new Set(open.filter(t => t.review_status === "approved").map(t => t.cluster_id));
      }
    }
    $("ts").textContent = state.run ? "마지막 분석 " + when(state.run.finished_at) : "";

    if (view === "menus") state.menus = await api(`/v1/menus?customer_id=${cid()}`);
    if (view === "questions") {
      state.questions = await api(
        `/v1/questions?customer_id=${cid()}&only_unanswered=${!!state.onlyMiss}&limit=40`);
    }
    if (view === "docs") state.documents = await api(`/v1/documents?customer_id=${cid()}`);
    if (view === "dups") state.dups = await api(`/v1/menus/duplicates?customer_id=${cid()}`);
    if (view === "gaps") state.topics = await api(`/v1/topics?customer_id=${cid()}&limit=40`);
    if (view === "runs") {
      const [summary, list] = await Promise.all([
        api(`/v1/dashboard/summary?customer_id=${cid()}`),
        api(`/v1/analysis/runs?customer_id=${cid()}&limit=15`),
      ]);
      state.summary = summary;
      state.runs = list;
    }
    render();
  } catch (e) { showError("불러오지 못했습니다: " + e.message); }
}

// 화면을 열어둔 채 옆에서 키오스크에 질문하는 일이 잦다. 자동 갱신이 없으면
// 저장이 안 되는 것처럼 보인다. 실제로 그렇게 오해했다.
// 다만 입력 중인 화면은 건드리지 않는다 — 고치던 문구가 날아간다.
let lastCount = null;
async function tick() {
  if (busy || view === "drafts" || editing) return;
  const before = lastCount;
  await loadAll();
  lastCount = state.todo?.unanalyzed ?? lastCount;
  if (before !== null && lastCount > before) {
    flash(`질문 ${lastCount - before}건이 새로 들어왔습니다`);
  }
}

(async () => {
  await loadCustomers();
  await loadAll();
  setInterval(tick, 10000);
})();
</script>
</body>
</html>

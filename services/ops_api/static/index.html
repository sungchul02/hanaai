<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>키오스크 CMS 콘솔</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --line: #e3e6ea; --ink: #1c2330; --muted: #6b7280;
    --brand: #1d4ed8; --ok: #047857; --warn: #b45309; --bad: #b91c1c;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.55;
    font-family: "Pretendard", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 14px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; }
  header .spacer { flex: 1; }
  .muted { color: var(--muted); font-size: 12.5px; }
  select, button, input, textarea { font-family: inherit; font-size: 13px; }
  select, input, textarea {
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; background: #fff; color: inherit;
  }
  button {
    border: 1px solid var(--line); background: #fff; border-radius: 7px;
    padding: 6px 12px; cursor: pointer; font-weight: 500;
  }
  button:hover { border-color: var(--brand); color: var(--brand); }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.primary:hover { opacity: .9; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  main { padding: 20px 24px 70px; max-width: 1180px; margin: 0 auto; }

  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card .l { color: var(--muted); font-size: 11.5px; }
  .card .v { font-family: var(--mono); font-size: 24px; margin-top: 3px; }
  .card .v.warn { color: var(--warn); } .card .v.ok { color: var(--ok); }

  h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 28px 0 10px; font-weight: 700; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-family: var(--mono); text-align: right; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 12px; font-size: 11px; border: 1px solid var(--line); color: var(--muted); }
  .tag.ok { color: var(--ok); border-color: #a7f3d0; background: #ecfdf5; }
  .tag.miss { color: var(--warn); border-color: #fde68a; background: #fffbeb; }
  .tag.ai { color: var(--brand); border-color: #bfdbfe; background: #eff6ff; }

  .prop { border-bottom: 1px solid var(--line); padding: 16px 18px; }
  .prop:last-child { border-bottom: 0; }
  .prop .t { font-size: 15px; font-weight: 650; }
  .prop .why { color: var(--muted); margin-top: 3px; }
  .draft { background: #fafbfc; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 12px; }
  .draft label { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 3px; }
  .draft input, .draft textarea { width: 100%; }
  .draft textarea { min-height: 76px; resize: vertical; line-height: 1.6; }
  .draft .row { margin-bottom: 10px; }
  .samples { margin-top: 10px; font-size: 13px; }
  .samples li { color: #374151; }
  .actions { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .empty { padding: 26px; text-align: center; color: var(--muted); }
  .err { margin-bottom: 14px; padding: 10px 14px; background: #fef2f2; border: 1px solid #fecaca; color: var(--bad); border-radius: 8px; }
  .flow { display: flex; gap: 0; margin: 18px 0 2px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .flow .s { flex: 1; padding: 11px 14px; border-right: 1px solid var(--line); }
  .flow .s:last-child { border-right: 0; }
  .flow .n { color: var(--muted); font-size: 11px; }
  .flow .t { font-weight: 600; margin-top: 2px; font-size: 13px; }
  .flow .v { font-family: var(--mono); font-size: 17px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>키오스크 CMS 콘솔</h1>
  <select id="customer" onchange="loadAll()"></select>
  <span class="spacer"></span>
  <span class="muted" id="ts">—</span>
  <button onclick="loadAll()">새로고침</button>
  <button class="primary" id="runbtn" onclick="runAnalysis()">분석 실행</button>
</header>

<main>
  <div id="error"></div>
  <div class="cards" id="cards"></div>

  <div class="flow" id="flow"></div>

  <h2>AI 추천 콘텐츠</h2>
  <div class="panel" id="proposals"></div>

  <h2>많이 나온 주제</h2>
  <div class="panel" id="topics"></div>

  <h2>최근 질문 <span style="text-transform:none;letter-spacing:0">
    <label class="muted"><input type="checkbox" id="onlyMiss" onchange="loadQuestions()"> 답하지 못한 것만</label>
  </span></h2>
  <div class="panel" id="questions"></div>

  <h2>현재 CMS 메뉴</h2>
  <div class="panel" id="menus"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cid = () => $("customer").value;

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error((await res.text()).slice(0, 300));
  return res.json();
}
function showError(msg) { $("error").innerHTML = msg ? `<div class="err">${esc(msg)}</div>` : ""; }
function when(iso) { return iso ? new Date(iso).toLocaleString("ko-KR") : "—"; }

async function loadCustomers() {
  const rows = await api("/v1/customers");
  $("customer").innerHTML = rows.map(c =>
    `<option value="${c.customer_id}">${esc(c.name)} (${esc(c.code)})</option>`).join("");
}

function renderCards(s) {
  const rate = s.answer_rate_7d == null ? "—" : (s.answer_rate_7d * 100).toFixed(1) + "%";
  const items = [
    ["질문 7일", s.questions_7d.toLocaleString(), ""],
    ["오늘", s.questions_today.toLocaleString(), ""],
    ["답변률", rate, s.answer_rate_7d != null && s.answer_rate_7d < 0.7 ? "warn" : "ok"],
    ["답하지 못함", s.unanswered_7d.toLocaleString(), s.unanswered_7d ? "warn" : "ok"],
    ["불필요 질문", s.junk_7d.toLocaleString(), ""],
    ["CMS 메뉴", s.menus_published, ""],
    ["AI가 만든 메뉴", s.menus_from_ai, s.menus_from_ai ? "ok" : ""],
    ["검토 대기", s.proposals_pending, s.proposals_pending ? "warn" : ""],
  ];
  $("cards").innerHTML = items.map(([l, v, c]) =>
    `<div class="card"><div class="l">${l}</div><div class="v ${c}">${v}</div></div>`).join("");

  $("flow").innerHTML = [
    ["1", "질문 수집", s.questions_7d.toLocaleString() + " 건"],
    ["2", "AI 분석", (s.proposals_pending + s.menus_from_ai) + " 주제 추천"],
    ["3", "관리자 승인", s.proposals_pending + " 건 대기"],
    ["4", "CMS 반영", s.menus_from_ai + " 건 반영됨"],
  ].map(([n, t, v]) =>
    `<div class="s"><div class="n">${n}단계</div><div class="t">${t}</div><div class="v">${v}</div></div>`).join("");
  $("ts").textContent = "마지막 분석 " + when(s.last_analysis_at);
}

function renderProposals(rows) {
  if (!rows.length) {
    $("proposals").innerHTML = '<div class="empty">검토 대기 중인 추천이 없습니다. [분석 실행]을 눌러보세요.</div>';
    return;
  }
  $("proposals").innerHTML = rows.map(p => `
    <div class="prop" id="p${p.proposal_id}">
      <div class="t">${esc(p.title)}</div>
      <div class="why">추천 이유: ${esc(p.reason)}</div>
      <div class="muted" style="margin-top:4px">
        질문 ${p.question_count}건 · 우선순위 ${p.impact_score} · 확신도 ${p.confidence}
      </div>
      <div class="samples">대표 질문:
        <ul>${p.sample_questions.map(q => `<li>${esc(q)}</li>`).join("")}</ul>
      </div>
      <div class="draft">
        <div class="row"><label>메뉴명</label><input id="t${p.proposal_id}" value="${esc(p.title)}"></div>
        <div class="row"><label>안내 문구</label><textarea id="b${p.proposal_id}">${esc(p.body)}</textarea></div>
        <div class="row"><label>검색 키워드 (쉼표로 구분)</label>
          <input id="k${p.proposal_id}" value="${esc(p.keywords.join(', '))}"></div>
      </div>
      <div class="actions">
        <button class="primary" onclick="approve(${p.proposal_id})">추가하기</button>
        <button onclick="ignoreIt(${p.proposal_id})">무시</button>
        <span class="muted">문구를 고친 뒤 [추가하기]를 누르면 '수정 후 반영'으로 기록됩니다</span>
      </div>
    </div>`).join("");
}

async function approve(id) {
  const reviewer = prompt("검토자 이름", "robin");
  if (!reviewer) return;
  const body = {
    reviewer,
    title: $("t" + id).value.trim(),
    body: $("b" + id).value.trim(),
    keywords: $("k" + id).value.split(",").map(s => s.trim()).filter(Boolean),
  };
  try {
    await api(`/v1/proposals/${id}/approve`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    });
    await loadAll();
  } catch (e) { showError(e.message); }
}

async function ignoreIt(id) {
  const reviewer = prompt("검토자 이름", "robin");
  if (!reviewer) return;
  const note = prompt("무시하는 이유 (프롬프트 개선에 씁니다)", "") || null;
  try {
    await api(`/v1/proposals/${id}/ignore`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ reviewer, note })
    });
    await loadAll();
  } catch (e) { showError(e.message); }
}

function renderTopics(rows) {
  if (!rows.length) { $("topics").innerHTML = '<div class="empty">분석 결과가 없습니다.</div>'; return; }
  $("topics").innerHTML = `<table><thead><tr>
      <th>대표 질문</th><th>키워드</th><th class="num">질문</th><th class="num">미응답</th><th>상태</th>
    </tr></thead><tbody>` + rows.map(t => {
      const state = t.covered_menu_title
        ? `<span class="tag ok">기존 메뉴로 응답</span> ${esc(t.covered_menu_title)}`
        : (t.has_proposal ? '<span class="tag ai">추천 생성됨</span>' : '<span class="tag">추천 안 함</span>');
      return `<tr><td>${esc(t.label)}</td>
        <td class="muted">${t.keywords.map(esc).join(", ")}</td>
        <td class="num">${t.size}</td><td class="num">${t.unanswered}</td><td>${state}</td></tr>`;
    }).join("") + `</tbody></table>`;
}

function renderQuestions(rows) {
  if (!rows.length) { $("questions").innerHTML = '<div class="empty">질문이 없습니다.</div>'; return; }
  $("questions").innerHTML = `<table><thead><tr>
      <th>시각</th><th>키오스크</th><th>질문</th><th>응답</th><th>판정</th>
    </tr></thead><tbody>` + rows.map(q => `<tr>
      <td class="muted">${when(q.asked_at)}</td>
      <td class="muted">${esc(q.kiosk_serial)}</td>
      <td>${esc(q.question_text)}</td>
      <td>${q.answer_source === "cms_menu"
            ? `<span class="tag ok">응답</span> ${esc(q.matched_menu_title)}`
            : '<span class="tag miss">답변 불가</span>'}</td>
      <td class="muted">${esc(q.verdict)}</td>
    </tr>`).join("") + `</tbody></table>`;
}

function renderMenus(rows) {
  if (!rows.length) { $("menus").innerHTML = '<div class="empty">메뉴가 없습니다.</div>'; return; }
  $("menus").innerHTML = `<table><thead><tr>
      <th>메뉴명</th><th>안내 문구</th><th>키워드</th><th>출처</th><th>상태</th>
    </tr></thead><tbody>` + rows.map(m => `<tr>
      <td><b>${esc(m.title)}</b></td>
      <td style="max-width:420px">${esc(m.body)}</td>
      <td class="muted">${m.keywords.map(esc).join(", ")}</td>
      <td>${m.origin === "ai_proposal" ? '<span class="tag ai">AI 추천</span>' : '<span class="tag">직접 작성</span>'}</td>
      <td class="muted">${esc(m.status)}</td>
    </tr>`).join("") + `</tbody></table>`;
}

async function loadQuestions() {
  const miss = $("onlyMiss").checked;
  renderQuestions(await api(`/v1/questions?customer_id=${cid()}&only_unanswered=${miss}&limit=40`));
}

async function runAnalysis() {
  $("runbtn").disabled = true;
  $("runbtn").textContent = "분석 중...";
  try {
    const out = await api("/v1/analysis/run", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ customer_id: Number(cid()), days: 7 })
    });
    showError(out.error ? "일부 응답이 검증을 통과하지 못했습니다: " + out.error : "");
    await loadAll();
    alert(`분석 완료\n질문 ${out.questions_seen}건 → 주제 ${out.clusters_found}개 → 추천 ${out.proposals_made}건\n(백엔드: ${out.backend})`);
  } catch (e) { showError(e.message); }
  finally { $("runbtn").disabled = false; $("runbtn").textContent = "분석 실행"; }
}

async function loadAll() {
  if (!cid()) return;
  try {
    showError("");
    const [summary, proposals, topics, menus] = await Promise.all([
      api(`/v1/dashboard/summary?customer_id=${cid()}`),
      api(`/v1/proposals?customer_id=${cid()}&status=pending_review`),
      api(`/v1/topics?customer_id=${cid()}`),
      api(`/v1/menus?customer_id=${cid()}`),
    ]);
    renderCards(summary);
    renderProposals(proposals);
    renderTopics(topics);
    renderMenus(menus);
    await loadQuestions();
  } catch (e) { showError("불러오지 못했습니다: " + e.message); }
}

(async () => { await loadCustomers(); await loadAll(); })();
</script>
</body>
</html>

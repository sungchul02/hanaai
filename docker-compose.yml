services:
  postgres:
    image: postgres:16-alpine
    container_name: hanaai-postgres
    environment:
      POSTGRES_USER: hanaai
      POSTGRES_PASSWORD: hanaai
      POSTGRES_DB: hanaai
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanaai -d hanaai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

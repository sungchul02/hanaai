name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  HANAAI_ENV: ci
  HANAAI_DATABASE_URL: postgresql+psycopg://hanaai:hanaai@localhost:5432/hanaai

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy services agents orchestrator

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hanaai
          POSTGRES_PASSWORD: hanaai
          POSTGRES_DB: hanaai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hanaai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      # 마이그레이션 왕복. down 이 깨진 채로 머지되면 롤백할 수단이 사라진다.
      - name: migrate up / down / up
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - run: python scripts/seed.py
      - run: pytest

  # 과제 4: 개발 Agent 가 만든 PR 에만 적용되는 추가 검증.
  # 사람이 연 PR 은 건너뛴다.
  agent-pr-guard:
    if: startsWith(github.head_ref, 'agent/proposal-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      # TODO(M5): PR 본문의 proposal_id 로 scope 를 조회해 check_changes 를 돌린다.
      # 지금은 변경 규모만 본다.
      - name: guardrail check
        run: |
          python - <<'PY'
          import subprocess, sys
          from agents.developer.guardrails import GuardrailConfig, check_changes

          diff = subprocess.run(
              ["git", "diff", "--numstat", "origin/main...HEAD"],
              capture_output=True, text=True, check=True,
          ).stdout
          changed = {}
          for line in diff.splitlines():
              added, removed, path = (line.split("\t") + ["", "", ""])[:3]
              if not path:
                  continue
              changed[path] = (0 if added == "-" else int(added)) + (
                  0 if removed == "-" else int(removed)
              )

          report = check_changes("ops_backend", changed, GuardrailConfig())
          for v in report.violations:
              print(f"::error::[{v.rule}] {v.detail}")
          sys.exit(0 if report.ok else 1)
          PY
